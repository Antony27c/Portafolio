    <main>
        <section id="contacto" class="section contact-block contact-page">
            <p class="contact-kicker"><span>05.</span> <em data-i18n="contact.eyebrow">¿Y ahora?</em></p>
            <h2 data-i18n="contact.title">Decime hola</h2>
            <p data-i18n="contact.lead">¿Tenés un proyecto, una idea o una vacante? Escribime y te respondo apenas vea el mensaje.</p>
            <form class="contact-form" action="https://formspree.io/f/xjgplbrb" method="POST">
                <label for="name" data-i18n="form.name">Nombre completo *</label>
                <input type="text" id="name" name="name" data-i18n-placeholder="form.namePh" placeholder="Ej. Juan Pérez" required minlength="3">
                <label for="email" data-i18n="form.email">Email *</label>
                <input type="email" id="email" name="email" data-i18n-placeholder="form.emailPh" placeholder="ej. hola@correo.com" required>
                <label for="number" data-i18n="form.phone">Teléfono *</label>
                <input type="tel" id="number" name="telefono" data-i18n-placeholder="form.phonePh" placeholder="ej. 387000000" pattern="[0-9]{7,15}" required>
                <label for="residencia" data-i18n="form.city">Residencia *</label>
                <input type="text" id="residencia" name="residencia" data-i18n-placeholder="form.cityPh" placeholder="Salta Capital" required minlength="5">
                <label for="motivo" data-i18n="form.reason">Motivo *</label>
                <select id="motivo" name="motivo" required>
                    <option value="" data-i18n="form.reasonEmpty">-- Seleccioná una opción --</option>
                    <option value="consulta" data-i18n="form.reasonGeneral">Consulta general</option>
                    <option value="freelance" data-i18n="form.reasonWork">Proyecto / trabajo</option>
                    <option value="otro" data-i18n="form.reasonOther">Otro</option>
                </select>
                <label for="mensaje" data-i18n="form.message">Mensaje *</label>
                <textarea id="mensaje" name="mensaje" data-i18n-placeholder="form.messagePh" placeholder="Contame en qué puedo ayudarte" required minlength="10"></textarea>
                <label class="check-line">
                    <input type="checkbox" name="Terminos" required>
                    <span data-i18n="form.terms">Acepto los términos y condiciones *</span>
                </label>
                <button type="submit" class="btn-outline" data-i18n="form.submit">Enviar</button>
            </form>
        </section>
    </main>
