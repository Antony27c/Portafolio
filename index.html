<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portafolio de Antonio Chocobar — desarrollador de software en Salta, Argentina. React, Python, FastAPI y productos web de punta a punta.">
    <meta name="theme-color" content="#0a0814">
    <title>Antonio Chocobar · Desarrollador de software</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem("theme");
                if (!theme) {
                    theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
                }
                document.documentElement.setAttribute("data-theme", theme);
                var lang = localStorage.getItem("lang") || "es";
                document.documentElement.setAttribute("lang", lang);
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
